<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task 4 – Fetch API | ObaidUllah</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --card: #16213e;
      --accent: #10b981;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #ef4444;
      --border: #2d2d44;
      --gradient: linear-gradient(135deg, #10b981, #06b6d4);
    }

    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 2rem 1rem; }

    header { text-align: center; margin-bottom: 2.5rem; }
    .badge { display: inline-block; background: var(--gradient); color: #fff; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.3rem 1rem; border-radius: 999px; margin-bottom: 0.8rem; }
    header h1 { font-size: clamp(1.7rem,3.5vw,2.4rem); font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.4rem; }
    header p { color: var(--muted); }

    .container { max-width: 900px; margin: 0 auto; }

    /* Controls */
    .controls {
      display: flex; gap: 0.8rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center;
    }
    .src-btn {
      padding: 0.55rem 1.1rem;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
    }
    .src-btn.active, .src-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(16,185,129,.08); }
    .src-btn.active { font-weight: 600; }

    /* Loader */
    #loader { display: none; text-align: center; padding: 2.5rem; color: var(--muted); }
    #loader .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 0.8rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    #error { display: none; background: rgba(239,68,68,.1); border: 1px solid #ef4444; border-radius: 12px; padding: 1rem 1.4rem; color: #fca5a5; margin-bottom: 1rem; }

    /* Table view */
    #table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); }

    table { width: 100%; border-collapse: collapse; }
    thead tr { background: linear-gradient(90deg, rgba(16,185,129,.15), rgba(6,182,212,.15)); }
    th {
      padding: 0.85rem 1rem;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 0.8rem 1rem;
      font-size: 0.86rem;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.15s; }
    tbody tr:hover { background: rgba(255,255,255,.03); }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--gradient);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      color: #fff;
    }

    .name-cell { display: flex; align-items: center; gap: 0.7rem; }

    .chip {
      display: inline-block;
      background: rgba(16,185,129,.12);
      color: var(--accent);
      border: 1px solid rgba(16,185,129,.25);
      border-radius: 6px;
      font-size: 0.72rem;
      padding: 0.15rem 0.5rem;
    }

    .link { color: var(--accent2); text-decoration: none; }
    .link:hover { text-decoration: underline; }

    /* Stats */
    .stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 1.1rem; font-size: 0.82rem; color: var(--muted); }
    .stat span { color: var(--accent); font-weight: 600; }

    footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

<header>
  <div class="badge">Task 4 — Fetch API</div>
  <h1>User Directory</h1>
  <p>Retrieving &amp; displaying remote data with the Fetch API, destructuring &amp; template literals</p>
</header>

<div class="container">
  <div class="controls">
    <span style="font-size:0.82rem;color:var(--muted);font-weight:500;">Data source:</span>
    <button class="src-btn active" id="btn-users" onclick="loadSource('users')">Users</button>
    <button class="src-btn" id="btn-posts" onclick="loadSource('posts')">Posts</button>
    <button class="src-btn" id="btn-todos" onclick="loadSource('todos')">Todos</button>
  </div>

  <div class="stats" id="stats"></div>
  <div id="error"></div>
  <div id="loader"><div class="spinner"></div>Fetching data…</div>
  <div id="table-wrap"></div>
</div>

<footer>ObaidUllah · Web Engineering Mid-Semester Assignment · Task 4</footer>

<script>
  // ── Fetch API + arrow functions + destructuring + template literals ──

  const APIS = {
    users: 'https://jsonplaceholder.typicode.com/users',
    posts: 'https://jsonplaceholder.typicode.com/posts',
    todos: 'https://jsonplaceholder.typicode.com/todos',
  };

  const loader   = document.getElementById('loader');
  const errorEl  = document.getElementById('error');
  const tableWrap = document.getElementById('table-wrap');
  const statsEl  = document.getElementById('stats');

  let currentSource = 'users';

  // ── Generic fetch with error handling ──
  const fetchData = async (url) => {
    loader.style.display = 'block';
    tableWrap.innerHTML  = '';
    errorEl.style.display = 'none';
    statsEl.innerHTML    = '';

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP Error: ${res.status} ${res.statusText}`);
      return await res.json();
    } catch (err) {
      // Error handling
      errorEl.textContent   = `Error: ${err.message}`;
      errorEl.style.display = 'block';
      return null;
    } finally {
      loader.style.display = 'none';
    }
  };

  // ── Render Users table — uses destructuring ──
  const renderUsers = (users) => {
    statsEl.innerHTML = `
      <div class="stat">Total Users: <span>${users.length}</span></div>
      <div class="stat">API: <span>jsonplaceholder/users</span></div>
    `;

    const rows = users.map(({ id, name, email, phone, website, address, company }) => `
      <tr>
        <td><div class="name-cell"><div class="avatar">${name[0]}</div>${name}</div></td>
        <td><a class="link" href="mailto:${email}">${email}</a></td>
        <td>${phone.split(' ')[0]}</td>
        <td><a class="link" href="https://${website}" target="_blank">${website}</a></td>
        <td>${address.city}, ${address.zipcode}</td>
        <td><span class="chip">${company.name}</span></td>
      </tr>
    `).join('');

    tableWrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Email</th><th>Phone</th>
            <th>Website</th><th>City</th><th>Company</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  };

  // ── Render Posts table — uses destructuring ──
  const renderPosts = (posts) => {
    const slice = posts.slice(0, 20);
    statsEl.innerHTML = `
      <div class="stat">Showing: <span>${slice.length} / ${posts.length}</span></div>
      <div class="stat">API: <span>jsonplaceholder/posts</span></div>
    `;
    const rows = slice.map(({ id, userId, title, body }) => `
      <tr>
        <td style="color:var(--accent);font-weight:600">#${id}</td>
        <td>User ${userId}</td>
        <td style="text-transform:capitalize">${title}</td>
        <td style="color:var(--muted);font-size:0.8rem">${body.split('\n')[0]}</td>
      </tr>
    `).join('');
    tableWrap.innerHTML = `
      <table>
        <thead><tr><th>#</th><th>User</th><th>Title</th><th>Body</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  };

  // ── Render Todos table — uses destructuring ──
  const renderTodos = (todos) => {
    const slice = todos.slice(0, 20);
    const done  = slice.filter(t => t.completed).length;
    statsEl.innerHTML = `
      <div class="stat">Showing: <span>${slice.length}</span></div>
      <div class="stat">Completed: <span>${done}</span></div>
      <div class="stat">Pending: <span>${slice.length - done}</span></div>
    `;
    const rows = slice.map(({ id, userId, title, completed }) => `
      <tr>
        <td style="color:var(--accent);font-weight:600">#${id}</td>
        <td>User ${userId}</td>
        <td>${title}</td>
        <td>${completed
          ? `<span class="chip" style="background:rgba(16,185,129,.15)">Done</span>`
          : `<span class="chip" style="background:rgba(239,68,68,.1);color:#fca5a5;border-color:rgba(239,68,68,.3)">Pending</span>`}
        </td>
      </tr>
    `).join('');
    tableWrap.innerHTML = `
      <table>
        <thead><tr><th>#</th><th>User</th><th>Task</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  };

  const loadSource = async (src) => {
    currentSource = src;
    document.querySelectorAll('.src-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${src}`).classList.add('active');

    const data = await fetchData(APIS[src]);
    if (!data) return;

    const renderers = { users: renderUsers, posts: renderPosts, todos: renderTodos };
    renderers[src](data);
  };

  // Initial load
  loadSource('users');
</script>
</body>
</html>
