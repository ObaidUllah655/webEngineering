<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task 2 – AJAX Pagination | ObaidUllah</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --card: #16213e;
      --accent: #06b6d4;
      --accent2: #7c3aed;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #10b981;
      --border: #2d2d44;
      --gradient: linear-gradient(135deg, #06b6d4, #7c3aed);
    }

    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 2rem 1rem; }

    header { text-align: center; margin-bottom: 2.5rem; }
    header .badge { display: inline-block; background: var(--gradient); color: #fff; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.35rem 1rem; border-radius: 999px; margin-bottom: 1rem; }
    header h1 { font-size: clamp(1.8rem,4vw,2.6rem); font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.5rem; }
    header p { color: var(--muted); }

    .container { max-width: 780px; margin: 0 auto; }

    /* Stats bar */
    .stats {
      display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .stat-chip {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.6rem 1.2rem; font-size: 0.85rem; color: var(--muted);
    }
    .stat-chip span { color: var(--accent); font-weight: 600; }

    /* Post list */
    #post-list { display: grid; gap: 1rem; }

    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeSlide 0.35s ease both;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .post-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(6,182,212,.15); }
    .post-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--gradient); }

    .post-number {
      position: absolute; top: 1rem; right: 1.2rem;
      font-size: 0.72rem; font-weight: 600;
      color: var(--accent); opacity: 0.7;
    }

    .post-card h3 {
      font-size: 0.98rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      text-transform: capitalize;
      padding-right: 3rem;
    }

    .post-card p { font-size: 0.84rem; color: var(--muted); line-height: 1.6; }

    /* Loader */
    #loader {
      text-align: center; padding: 3rem;
      color: var(--muted); font-size: 0.95rem;
      display: none;
    }
    #loader .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    #error-msg { display: none; background: rgba(239,68,68,.1); border: 1px solid #ef4444; border-radius: 12px; padding: 1rem 1.5rem; color: #fca5a5; margin-bottom: 1rem; }

    /* Pagination */
    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 0.5rem; margin-top: 2rem; flex-wrap: wrap;
    }

    .page-btn {
      min-width: 40px; height: 40px; padding: 0 0.9rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
    }

    .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: rgba(6,182,212,.08); }
    .page-btn.active { background: var(--gradient); border-color: transparent; color: #fff; font-weight: 600; }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .page-info { color: var(--muted); font-size: 0.82rem; padding: 0 0.5rem; }

    footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

<header>
  <div class="badge">Task 2 — AJAX Pagination</div>
  <h1>Posts Explorer</h1>
  <p>Fetching data from JSONPlaceholder API with dynamic pagination</p>
</header>

<div class="container">
  <div class="stats">
    <div class="stat-chip">Total Posts: <span id="total-count">—</span></div>
    <div class="stat-chip">Per Page: <span>5</span></div>
    <div class="stat-chip">Page: <span id="current-page-stat">—</span></div>
  </div>

  <div id="error-msg">Error: Failed to fetch posts. Please check your internet connection.</div>
  <div id="loader"><div class="spinner"></div>Fetching posts from API…</div>
  <div id="post-list"></div>

  <div class="pagination" id="pagination"></div>
</div>

<footer>ObaidUllah · Web Engineering Mid-Semester Assignment · Task 2</footer>

<script>
  // ── ES6: let/const, arrow functions ──
  const API_URL    = 'https://jsonplaceholder.typicode.com/posts';
  const PER_PAGE   = 5;

  let allPosts     = [];
  let currentPage  = 1;

  const postList   = document.getElementById('post-list');
  const pagination = document.getElementById('pagination');
  const loader     = document.getElementById('loader');
  const errorMsg   = document.getElementById('error-msg');
  const totalEl    = document.getElementById('total-count');
  const pageStatEl = document.getElementById('current-page-stat');

  // Fetch posts using AJAX (Fetch API + async/await)
  const fetchPosts = async () => {
    loader.style.display = 'block';
    postList.innerHTML   = '';
    errorMsg.style.display = 'none';

    try {
      const response = await fetch(API_URL);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      allPosts = await response.json();
      totalEl.textContent = allPosts.length;
      renderPage(1);
    } catch (err) {
      errorMsg.style.display = 'block';
      console.error('Fetch error:', err);
    } finally {
      loader.style.display = 'none';
    }
  };

  // Render a specific page
  const renderPage = (page) => {
    currentPage = page;
    pageStatEl.textContent = page;

    const start = (page - 1) * PER_PAGE;
    const slice = allPosts.slice(start, start + PER_PAGE);

    postList.innerHTML = slice.map((post, i) => `
      <div class="post-card" style="animation-delay:${i * 0.06}s">
        <div class="post-number">#${post.id}</div>
        <h3>${post.title}</h3>
        <p>${post.body}</p>
      </div>
    `).join('');

    renderPagination();
  };

  // Build pagination controls
  const renderPagination = () => {
    const totalPages = Math.ceil(allPosts.length / PER_PAGE);
    let html = '';

    // Prev button
    html += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="renderPage(${currentPage - 1})">‹ Prev</button>`;

    // Page number buttons (show window of 5)
    const start = Math.max(1, currentPage - 2);
    const end   = Math.min(totalPages, start + 4);

    if (start > 1) html += `<button class="page-btn" onclick="renderPage(1)">1</button><span class="page-info">…</span>`;

    for (let p = start; p <= end; p++) {
      html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="renderPage(${p})">${p}</button>`;
    }

    if (end < totalPages) html += `<span class="page-info">…</span><button class="page-btn" onclick="renderPage(${totalPages})">${totalPages}</button>`;

    // Next button
    html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="renderPage(${currentPage + 1})">Next ›</button>`;

    pagination.innerHTML = html;
  };

  // Boot
  fetchPosts();
</script>
</body>
</html>
