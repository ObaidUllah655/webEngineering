<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task 5 – To-Do List | ObaidUllah</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --card: #16213e;
      --accent: #a855f7;
      --accent2: #ec4899;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --border: #2d2d44;
      --gradient: linear-gradient(135deg, #a855f7, #ec4899);
    }

    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 2rem 1rem; }

    header { text-align: center; margin-bottom: 2.5rem; }
    .badge { display: inline-block; background: var(--gradient); color: #fff; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.3rem 1rem; border-radius: 999px; margin-bottom: 0.8rem; }
    header h1 { font-size: clamp(1.7rem,3.5vw,2.4rem); font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.4rem; }
    header p { color: var(--muted); }

    .container { max-width: 620px; margin: 0 auto; }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 0.8rem; margin-bottom: 1.5rem; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; text-align: center; }
    .stat-card .num { font-size: 1.8rem; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-card .lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.2rem; }

    /* Input area */
    .input-area {
      display: flex; gap: 0.7rem; margin-bottom: 1.2rem;
    }
    #task-input {
      flex: 1;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1.1rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #task-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(168,85,247,.15); }

    #add-btn {
      padding: 0.85rem 1.4rem;
      background: var(--gradient);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    #add-btn:hover { opacity: 0.88; transform: scale(1.03); }
    #add-btn:active { transform: scale(0.97); }

    /* Filters */
    .filters { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; }
    .filter-btn {
      padding: 0.4rem 0.9rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
    }
    .filter-btn.active, .filter-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(168,85,247,.08); }
    .filter-btn.active { font-weight: 600; }

    /* Task list */
    #task-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .task-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      position: relative;
      overflow: hidden;
      animation: slideIn 0.3s ease both;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .task-item:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(168,85,247,.12); }

    .task-item.completed { opacity: 0.55; }
    .task-item.completed .task-text { text-decoration: line-through; color: var(--muted); }

    /* Custom checkbox */
    .check-btn {
      width: 22px; height: 22px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: none;
      cursor: pointer;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .check-btn:hover { border-color: var(--success); }
    .task-item.completed .check-btn { background: var(--success); border-color: var(--success); }

    .task-text { flex: 1; font-size: 0.92rem; line-height: 1.5; }

    .task-meta { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }

    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.3rem;
      border-radius: 6px;
      transition: color 0.18s, background 0.18s;
      flex-shrink: 0;
    }
    .delete-btn:hover { color: var(--danger); background: rgba(239,68,68,.1); }

    /* Empty state */
    #empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); display: none; }
    #empty-state .emoji { font-size: 3rem; margin-bottom: 1rem; }

    /* Clear completed */
    #clear-btn {
      display: none;
      margin-top: 1.2rem;
      width: 100%;
      padding: 0.65rem;
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 10px;
      color: #fca5a5;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s;
    }
    #clear-btn:hover { background: rgba(239,68,68,.18); }

    footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

<header>
  <div class="badge">Task 5 — To-Do List</div>
  <h1>My Task Manager</h1>
  <p>Dynamic To-Do app using ES6 Classes · map() · filter() · Arrow Functions</p>
</header>

<div class="container">
  <div class="stats-row">
    <div class="stat-card"><div class="num" id="stat-total">0</div><div class="lbl">Total</div></div>
    <div class="stat-card"><div class="num" id="stat-done">0</div><div class="lbl">Done</div></div>
    <div class="stat-card"><div class="num" id="stat-pending">0</div><div class="lbl">Pending</div></div>
  </div>

  <div class="input-area">
    <input type="text" id="task-input" placeholder="Add a new task… (press Enter or click +)" maxlength="120"/>
    <button id="add-btn">+ Add</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" id="f-all"       onclick="setFilter('all')">All</button>
    <button class="filter-btn"        id="f-pending"   onclick="setFilter('pending')">Pending</button>
    <button class="filter-btn"        id="f-completed" onclick="setFilter('completed')">Completed</button>
  </div>

  <div id="task-list"></div>
  <div id="empty-state"><div class="emoji">[ ]</div><p>No tasks here. Add one above!</p></div>
  <button id="clear-btn" onclick="manager.clearCompleted(); render();">Clear Completed</button>
</div>

<footer>ObaidUllah · Web Engineering Mid-Semester Assignment · Task 5</footer>

<script>
  // ── ES6 Class: Task ──
  class Task {
    constructor(text) {
      this.id        = Date.now();
      this.text      = text;
      this.completed = false;
      this.createdAt = new Date().toLocaleString('en-PK', {
        hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short'
      });
    }

    toggle() { this.completed = !this.completed; }
  }

  // ── ES6 Class: TaskManager ──
  class TaskManager {
    constructor() { this.tasks = []; }

    add(text) {
      if (!text.trim()) return false;
      this.tasks.push(new Task(text.trim()));
      return true;
    }

    // Arrow function in method
    delete = (id) => {
      this.tasks = this.tasks.filter(t => t.id !== id);
    };

    toggle = (id) => {
      const task = this.tasks.find(t => t.id === id);
      if (task) task.toggle();
    };

    clearCompleted = () => {
      this.tasks = this.tasks.filter(t => !t.completed);
    };

    // filter() by status
    getFiltered = (filter) => {
      if (filter === 'completed') return this.tasks.filter(t => t.completed);
      if (filter === 'pending')   return this.tasks.filter(t => !t.completed);
      return this.tasks;
    };

    get total()   { return this.tasks.length; }
    get done()    { return this.tasks.filter(t => t.completed).length; }
    get pending() { return this.tasks.filter(t => !t.completed).length; }
  }

  // ── App state ──
  const manager   = new TaskManager();
  let currentFilter = 'all';

  const taskInput  = document.getElementById('task-input');
  const taskList   = document.getElementById('task-list');
  const emptyState = document.getElementById('empty-state');
  const clearBtn   = document.getElementById('clear-btn');

  // ── Render function — uses map() + arrow functions ──
  const render = () => {
    const filtered = manager.getFiltered(currentFilter);

    // Update stats
    document.getElementById('stat-total').textContent   = manager.total;
    document.getElementById('stat-done').textContent    = manager.done;
    document.getElementById('stat-pending').textContent = manager.pending;

    // Show/hide clear button
    clearBtn.style.display = manager.done > 0 ? 'block' : 'none';

    // Show empty state
    if (filtered.length === 0) {
      taskList.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    // Use map() to build task items
    taskList.innerHTML = filtered.map(task => `
      <div class="task-item ${task.completed ? 'completed' : ''}" id="task-${task.id}">
        <button class="check-btn" onclick="toggleTask(${task.id})">
          ${task.completed ? 'v' : ''}
        </button>
        <div style="flex:1">
          <div class="task-text">${task.text}</div>
          <div class="task-meta">Added ${task.createdAt}</div>
        </div>
        <button class="delete-btn" onclick="deleteTask(${task.id})" title="Delete">x</button>
      </div>
    `).join('');
  };

  // ── Event handlers — arrow functions ──
  const addTask = () => {
    const ok = manager.add(taskInput.value);
    if (ok) { taskInput.value = ''; render(); }
  };

  const deleteTask = (id) => { manager.delete(id); render(); };
  const toggleTask = (id) => { manager.toggle(id); render(); };

  const setFilter = (filter) => {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`f-${filter}`).classList.add('active');
    render();
  };

  document.getElementById('add-btn').addEventListener('click', addTask);
  taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  // ── Seed with sample tasks ──
  ['Study Web Engineering Chapter 5', 'Complete Task 5 — To-Do App', 'Review ES6 class syntax'].forEach(t => manager.add(t));
  manager.toggle(manager.tasks[0].id); // mark first as done
  render();
</script>
</body>
</html>
